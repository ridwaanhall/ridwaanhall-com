name: Release

# Every push to main becomes a release, with nobody doing anything:
#
#   1. Any release the site has recorded that GitHub has no tag for gets one --
#      a run that failed half way, or a note added by hand in the admin.
#   2. Every commit since the newest `v*` tag is sent to POST /api/patch-notes,
#      which files them by type, picks the version (a breaking change is a
#      major, a ✨feat a minor, anything else a patch) and stores the note.
#   3. That version is tagged and published as a GitHub Release.
#
# The commits come from the tag rather than from the push, so nothing is lost
# between releases: the very first run after the redesign finds no release on
# the site, sends everything since v3.0.0, and records it as 4.0.0.
#
# **It talks to the site's own Vercel address, never to ridwaanhall.com.** The
# domain is behind Cloudflare, which answers GitHub's runners with a "Just a
# moment..." challenge (403) that no script can pass -- the cron workflow this
# replaced failed that way on every run for its whole life. The Vercel address
# is behind Vercel Authentication instead, which a Protection Bypass for
# Automation secret opens; PATCH_NOTES_TOKEN still guards the write itself.
#
# A commit carrying `[skip release]` is left out, and a push of nothing else
# records nothing. A `Release-Title:` or `Release-Summary:` line in a commit
# message names the release it lands in. The repository is public, so this costs no Actions minutes;
# a run takes well under one.
on:
  push:
    branches: [main]
  # A re-run by hand, for when the site was down during a push.
  workflow_dispatch:

# Writing a tag and a release is the whole of what it needs from the repository.
permissions:
  contents: write

# Versions are handed out in order, so runs queue rather than race or cancel.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The production deployment's own address; a repository secret can point
      # it elsewhere.
      API_URL: ${{ secrets.PATCH_NOTES_URL || 'https://ridwaanhall-com-roneha.vercel.app' }}
      VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      PATCH_NOTES_TOKEN: ${{ secrets.PATCH_NOTES_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Full history and every tag: the commits since the last release are
      # read from git, not from the push event.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the secrets are set
        run: |
          missing=""
          [ -n "$VERCEL_BYPASS" ] || missing="$missing VERCEL_AUTOMATION_BYPASS_SECRET"
          [ -n "$PATCH_NOTES_TOKEN" ] || missing="$missing PATCH_NOTES_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Tag any release the site has and GitHub does not
        run: |
          set -euo pipefail
          curl -sS --fail-with-body --max-time 60 --retry 2 -H "x-vercel-protection-bypass: ${VERCEL_BYPASS}" \
            -o notes.json "${API_URL}/api/patch-notes"
          # Oldest first, so tags are created in the order the releases happened.
          jq -r '.data | reverse | .[] | select(.commit_sha != "") | "\(.version) \(.commit_sha)"' notes.json |
          while read -r version sha; do
            tag="v${version}"
            if gh release view "$tag" >/dev/null 2>&1; then continue; fi
            curl -sS --fail-with-body --max-time 60 -H "x-vercel-protection-bypass: ${VERCEL_BYPASS}" \
              -o note.json "${API_URL}/api/patch-notes/${version}"
            jq -r '.data.markdown' note.json > notes.md
            # One line, trimmed: `tr` on jq's output turned its closing newline
            # into a trailing space ("v4.0.0: New UI ").
            title=$(jq -r '(.data.title // "") | gsub("\\s+"; " ") | sub("^ "; "") | sub(" $"; "")' note.json)
            name="$tag"; if [ -n "$title" ]; then name="$tag: $title"; fi
            gh release create "$tag" --target "$sha" --title "$name" --notes-file notes.md
            echo "Published $tag, which the site had recorded."
          done
          git fetch --tags --force --quiet

      - name: Record this push on the site
        id: record
        run: |
          set -euo pipefail
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
          range="${last:+${last}..}HEAD"
          echo "Commits in ${range}"

          # One record per commit: its sha and whole message, split on control
          # characters no message contains.
          # Oldest first, so a release reads in the order things happened.
          git log --reverse --no-merges --format='%H%x1f%B%x1e' "$range" |
            jq -Rs --arg sha "$(git rev-parse HEAD)" '{
              sha: $sha,
              commits: [split("\u001e")[] | ltrimstr("\n") | select(length > 0) | split("\u001f") | {sha: .[0], message: (.[1] // "")}]
            }' > push.json
          echo "$(jq '.commits | length' push.json) commits to send."

          curl -sS --fail-with-body --max-time 60 --retry 2 --retry-connrefused \
            -H "Authorization: Bearer ${PATCH_NOTES_TOKEN}" \
            -H "x-vercel-protection-bypass: ${VERCEL_BYPASS}" \
            -H "Content-Type: application/json" \
            --data @push.json -o note.json "${API_URL}/api/patch-notes"
          cat note.json; echo

          if [ "$(jq -r '.data.skipped // false' note.json)" = "true" ]; then
            echo "Nothing in this push to release."
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          jq -r '.data.markdown' note.json > notes.md
          echo "version=$(jq -r '.data.version' note.json)" >> "$GITHUB_OUTPUT"

      - name: Tag it and publish the GitHub Release
        if: steps.record.outputs.version != ''
        env:
          VERSION: ${{ steps.record.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          # A re-run finds its own release already there; that is success.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already published."
            exit 0
          fi
          # The title the site gave it, read back rather than passed through the
          # shell: it is text, and an expression spliced into this script would
          # run it as a command. (GitHub evaluates expressions inside `run:`
          # even in shell comments, so this one names none.)
          curl -sS --fail-with-body --max-time 60 -H "x-vercel-protection-bypass: ${VERCEL_BYPASS}" \
            -o release.json "${API_URL}/api/patch-notes/${VERSION}" || true
          title=$(jq -r '(.data.title // "") | gsub("\\s+"; " ") | sub("^ "; "") | sub(" $"; "")' release.json 2>/dev/null || true)
          name="$tag"; if [ -n "$title" ]; then name="$tag: $title"; fi
          gh release create "$tag" --target "$(git rev-parse HEAD)" --title "$name" --notes-file notes.md
