{% comment %}
Structured JSON editor.

The <textarea> below is the single named control that actually gets submitted;
adminJsonWidgets.js hides it and builds a nameless editing UI inside .jsonw-ui,
syncing back on every change. With JS unavailable this degrades to a plain JSON
textarea, i.e. exactly the previous admin behaviour.

The textarea markup is included from Django's own template rather than written
inline, because that template deliberately starts its content with a newline to
compensate for the HTML parser swallowing one after the opening tag.
{% endcomment %}
<div class="jsonw" data-jsonw="{{ widget.jsonw_kind }}" data-jsonw-options="{{ widget.jsonw_options }}">
    <div class="jsonw-ui" hidden></div>
    <div class="jsonw-src">
        {% include "django/forms/widgets/textarea.html" %}
    </div>
</div>
