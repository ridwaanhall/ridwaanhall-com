{% load static %}
{% load image_filters %}

{% for tech in project.tech_stack %}
    {% if tech.icon_svg %}
        <div class="flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-zinc-700 hover:bg-zinc-600 transition-all duration-300 cursor-help" title="{{ tech.name }}">
            <img src="{{ tech.icon_svg|wsrv_image:'25x25' }}" alt="{{ tech.name }}" class="w-4 h-4 sm:w-5 sm:h-5" />
        </div>
    {% endif %}
{% endfor %}
