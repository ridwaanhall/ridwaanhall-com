{% comment %}
One notification toast -- the single source of this markup for the whole site.

Rendered two ways, both from this file, so the two paths can't drift:

  * server-side, once per Django message, by components/notifications.html
  * client-side, by notify.js cloning one of the per-variant <template>
    elements that components/notifications.html also builds from this file

That is why the variant classes live in this file, in a conditional chain, rather than in a
table inside notify.js: cloning a ready-made variant means the JS needs no
knowledge of the palette at all, and adding a variant is a one-file change.

Arguments: toast_variant (success|error|info), toast_text (optional -- the
<template> copies are rendered empty and filled in by notify.js).

Colour is carried by the border and the text, over an opaque bg-zinc-900,
rather than by a translucent tint. A toast floats over arbitrary page content,
so a /20 fill would composite against whatever happens to be behind it; the
site's depth comes from the border and surface ramps in both themes anyway.
The variant is also stated in words for screen readers, since colour alone
cannot carry it.
{% endcomment %}
<div class="notify-toast pointer-events-auto flex w-full items-start gap-3 rounded-lg border bg-zinc-900 px-4 py-3 text-sm transition-all duration-300 ease-out {% if toast_variant == 'success' %}border-green-700 text-green-300{% elif toast_variant == 'error' %}border-red-700 text-red-300{% else %}border-blue-700 text-blue-300{% endif %}"
     role="status">
    <span class="sr-only">{% if toast_variant == 'success' %}Success:{% elif toast_variant == 'error' %}Error:{% else %}Note:{% endif %}</span>
    <span class="min-w-0 flex-1 break-words" data-notify-text>{{ toast_text }}</span>
    <button type="button" data-notify-close
            class="-mr-1 flex-shrink-0 rounded p-1 text-zinc-500 hover:bg-zinc-800 hover:text-zinc-200 transition-colors"
            title="Dismiss" aria-label="Dismiss">
        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
    </button>
</div>
