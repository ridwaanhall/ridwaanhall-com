{% comment %}
One confirmation dialog for the whole site.

Any control that needs "are you sure?" becomes a plain button carrying
data-confirm-* attributes; confirmDialog.js fills this in and posts the form:

    <button type="button"
            data-confirm-action="{% url 'account_logout' %}"
            data-confirm-title="Sign out?"
            data-confirm-message="You'll need to sign in again to comment."
            data-confirm-label="Sign out"
            data-confirm-detail="optional quoted excerpt">

Rendered here, at body level, rather than inside the page. #page-content
carries a transform (translate-y-8), and a transformed ancestor becomes the
containing block for its position:fixed descendants -- a dialog rendered inside
it can only cover the content column, leaving the sidebar unblurred. The search
modal has always sat outside that container, which is why its blur covers the
whole viewport.
{% endcomment %}
<div id="confirm-dialog" class="fixed inset-0 z-50 backdrop-blur-none hidden transition-all duration-300 ease-out" aria-hidden="true">
    <div id="confirm-dialog-backdrop" class="flex min-h-full items-center justify-center p-4">
        <div id="confirm-dialog-content" role="dialog" aria-modal="true" aria-labelledby="confirm-dialog-title"
             class="relative mx-auto max-w-md w-full overflow-hidden rounded-xl border-2 border-zinc-800 bg-black ring-1 ring-black/5 shadow-2xl shadow-black/60 transform scale-95 opacity-0 transition-all duration-300 ease-out p-5">
            <div class="flex items-start gap-3">
                <div id="confirm-dialog-icon" class="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-full border border-zinc-700 bg-zinc-900">
                    <svg class="h-5 w-5 text-zinc-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M5.07 19h13.86a2 2 0 001.74-3L13.74 4a2 2 0 00-3.48 0L3.33 16a2 2 0 001.74 3z"></path>
                    </svg>
                </div>
                <div class="min-w-0">
                    <h3 id="confirm-dialog-title" class="text-base font-semibold text-zinc-100"></h3>
                    <p id="confirm-dialog-message" class="mt-1 text-sm text-zinc-400"></p>
                </div>
            </div>

            <blockquote id="confirm-dialog-detail"
                        class="mt-4 hidden max-h-24 overflow-y-auto rounded-lg border border-zinc-800 bg-zinc-900/60 px-3 py-2 text-sm text-zinc-400 italic break-words whitespace-pre-line"></blockquote>

            <div class="mt-5 flex justify-end gap-2">
                <button type="button" id="confirm-dialog-cancel" data-confirm-dialog-close
                        class="rounded-lg border border-zinc-700 bg-zinc-900 px-4 py-2 text-sm text-zinc-200 hover:bg-zinc-800 transition-all duration-300">
                    Cancel
                </button>
                <form method="post" id="confirm-dialog-form" action="">
                    {% csrf_token %}
                    <input type="hidden" name="next" id="confirm-dialog-next" value="{{ request.get_full_path }}" />
                    <button type="submit" id="confirm-dialog-confirm"
                            class="rounded-lg border border-zinc-700 bg-zinc-900 px-4 py-2 text-sm text-zinc-100 hover:bg-zinc-800 transition-all duration-300"></button>
                </form>
            </div>
        </div>
    </div>
</div>
